<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dork Mail" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
    <title>Dork Mail</title>
    <script>
      // Applies Bulwark's appearance settings, which it keeps in this origin's localStorage, before
      // first paint and again whenever Bulwark changes them in another tab. Mirrors Bulwark 1.21's
      // theme-storage and settings-storage shapes.
      (function () {
        var root = document.documentElement;
        var systemDark = matchMedia("(prefers-color-scheme: dark)");
        var FONT_SCALE = { small: 0.875, medium: 1, large: 1.125, "x-large": 1.25, "xx-large": 1.5, "xxx-large": 1.75, huge: 2 };

        function read(key) {
          try { return JSON.parse(localStorage.getItem(key)).state || {}; } catch (e) { return {}; }
        }

        function apply() {
          var theme = read("theme-storage");
          var settings = read("settings-storage");
          var pref = theme.theme || "system";
          var variant = pref === "dark" || (pref === "system" && systemDark.matches) ? "dark" : "light";
          root.classList.toggle("dark", variant === "dark");
          document.querySelector('meta[name="theme-color"]').content = variant === "dark" ? "#0a0a0a" : "#ffffff";

          var active = (theme.installedThemes || []).filter(function (t) { return t.id === theme.activeThemeId; })[0];
          var style = document.getElementById("bulwark-theme");
          if (!style) {
            style = document.createElement("style");
            style.id = "bulwark-theme";
            document.head.appendChild(style);
          }
          style.textContent = active && active.css && (active.variants || []).indexOf(variant) >= 0 ? active.css : "";

          root.style.setProperty("--font-size-base", 100 * (FONT_SCALE[settings.fontSize] || 1) + "%");
          var motion = settings.reduceMotion === "on" ? "reduce" : settings.reduceMotion === "off" ? "full" : null;
          if (motion) root.setAttribute("data-motion", motion);
          else root.removeAttribute("data-motion");
        }

        apply();
        systemDark.addEventListener("change", apply);
        addEventListener("storage", function (e) {
          if (e.key === "theme-storage" || e.key === "settings-storage") apply();
        });
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="svelte" style="display: contents">%sveltekit.body%</div>
  </body>
</html>
